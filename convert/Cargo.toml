[package]
name = "pacuda-convert"
version = "0.1.0"
edition = "2024"
license = "0BSD"
description = "Records pyAmpliCol recurrence plan runs (the patched RustiCol's record mode) into .pacuda files"

[[bin]]
name = "pacuda-convert"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libloading = "0.9"
# the patched RustiCol (rusticol/prepare.sh: pyAmpliCol at rusticol/UPSTREAM with rusticol/patches),
# its record mode (feature pacman); used only to convert
rusticol-core = { path = "../build/rusticol/pyamplicol/rust/crates/rusticol-core", features = ["pacman"] }
